<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: "Great Vibes";
      src: url("../public/fonts/GreatVibes-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #f5f3ee;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(154, 133, 84, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(125, 141, 110, 0.07) 0%, transparent 45%);
    }

    .canvas {
      width: 1080px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 140px;
    }

    .icon-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 2px solid rgba(125, 141, 110, 0.45);
      background: rgba(238, 242, 235, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-ring svg {
      width: 52px;
      height: 52px;
      stroke: #7d8d6e;
      fill: none;
      stroke-width: 1.5;
    }

    .brand-name {
      font-family: "Great Vibes", cursive;
      font-size: 118px;
      font-weight: 400;
      line-height: 1;
      color: #2d3824;
      text-align: center;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="icon-ring" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
    </div>
    <div class="brand-name">Wedding Board</div>
  </div>
</body>
</html>
