name: CI

on:
  push:
    branches: [main, master, develop, feature/**]
  pull_request:
    branches: [main, master, develop, feature/**]

defaults:
  run:
    shell: bash

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Krok blokujący: błąd typu nie wchodzi na gałąź.
      - name: Typecheck
        run: npx tsc --noEmit

      # Krok blokujący — lint jest wyczyszczony do zera i ma tak zostać.
      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:ci
        env:
          CI: true

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Gałąź robocza to feature/P1, więc warunek na main/master oznaczał, że E2E
    # nie uruchamiały się NIGDY — łącznie z testami izolacji danych i uprawnień.
    if: github.event_name == 'push'

    # Aplikacja nie wstanie bez bazy, a schemat jest pod PostgreSQL.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eventboard_test?schema=public
      AUTH_SESSION_SECRET: e2e-secret-nie-uzywany-poza-ci
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Przygotuj bazę
        run: npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E (chromium only)
        run: npm run test:e2e -- --project=chromium
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          # Bez tych sekretów testy izolacji i uprawnień same się pomijają
          # (zobacz nagłówki plików w e2e/) — nie wywracają CI, ale też niczego
          # nie pilnują. Ustaw je w Settings → Secrets → Actions.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_NONE_EMAIL: ${{ secrets.E2E_NONE_EMAIL }}
          E2E_NONE_PASSWORD: ${{ secrets.E2E_NONE_PASSWORD }}
          E2E_VIEW_EMAIL: ${{ secrets.E2E_VIEW_EMAIL }}
          E2E_VIEW_PASSWORD: ${{ secrets.E2E_VIEW_PASSWORD }}
          E2E_EDIT_EMAIL: ${{ secrets.E2E_EDIT_EMAIL }}
          E2E_EDIT_PASSWORD: ${{ secrets.E2E_EDIT_PASSWORD }}
